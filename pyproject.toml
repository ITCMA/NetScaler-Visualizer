[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nsviz"
dynamic = ["version"]
description = "Visualize NetScaler (ADC) environments - HA pairs, double-hop chains - and check ns.conf files, as one offline HTML report"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # standard library only
license = { text = "Proprietary - all rights reserved" }
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Security",
]

[project.scripts]
nsviz = "nsviz.cli:main"

[tool.setuptools]
packages = ["nsviz", "nsviz.rules"]

[tool.setuptools.dynamic]
version = { attr = "nsviz.__version__" }

[tool.setuptools.package-data]
nsviz = ["assets/*", "assets/vendor/*", "assets/i18n/*", "rules/i18n/*"]
