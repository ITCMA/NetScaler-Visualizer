#NS13.1 Build 60.29
# SYNTHETIC EXAMPLE - backend NetScaler, node B (HA pair with node A)
set ns config -IPAddress 10.20.0.3 -netmask 255.255.255.0
set ns hostName be-adc-b
enable ns feature LB SSL REWRITE RESPONDER
add ha node 1 10.20.0.2
add ns ip 10.20.0.50 255.255.255.0 -type VIP
add server app1 10.40.0.11
add server app2 10.40.0.12
add serviceGroup sg_app SSL
bind serviceGroup sg_app app1 8443
bind serviceGroup sg_app app2 8443
add ssl certKey be_cert -cert be.pem -key be.key
add lb vserver be_lb_ssl SSL 10.20.0.50 443 -persistenceType COOKIEINSERT
bind lb vserver be_lb_ssl sg_app
bind ssl vserver be_lb_ssl -certkeyName be_cert
set ssl vserver be_lb_ssl -tls1 DISABLED -tls11 DISABLED -tls13 ENABLED
add lb vserver be_lb_web HTTP 10.20.0.51 80
bind lb vserver be_lb_web sg_app
