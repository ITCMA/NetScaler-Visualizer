name: Release builds
# Builds the single-file app for Windows and the app bundle (nsviz.app, zipped) for macOS (Apple silicon and Intel) with
# PyInstaller. On macOS the command line is part of the app bundle: nsviz.app/Contents/MacOS/nsviz.
# Manual run: artifacts only. Tag v*: additionally a draft release with the files (published by hand).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: nsviz-windows-x64.exe
            src: dist/nsviz.exe
          - os: macos-latest
            name: nsviz-macos-arm64
            bundle: nsviz-macos-arm64-app.zip
          - os: macos-15-intel
            name: nsviz-macos-x64
            bundle: nsviz-macos-x64-app.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.11.1"
      - name: Build
        if: ${{ !matrix.bundle }}
        run: python scripts/build_app.py
      - name: Smoke test
        if: ${{ !matrix.bundle }}
        shell: bash
        run: ./${{ matrix.src }} --version
      - name: Rename
        if: ${{ !matrix.bundle }}
        shell: bash
        run: mkdir out && cp "${{ matrix.src }}" "out/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.bundle }}
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}
          if-no-files-found: error
      - name: Create app icon from SVG
        if: matrix.bundle
        # the .icns is a build product, generated from assets/nsviz-icon.svg and never committed
        run: |
          brew install librsvg
          scripts/make_icns.sh assets/nsviz-icon.svg "$RUNNER_TEMP/nsviz.icns"
      - name: Build macOS app bundle
        if: matrix.bundle
        run: python scripts/build_app.py --bundle --icon "$RUNNER_TEMP/nsviz.icns"
      - name: Smoke test app bundle
        if: matrix.bundle
        run: ./dist-bundle/nsviz.app/Contents/MacOS/nsviz --version
      - name: Pack app bundle
        if: matrix.bundle
        # ditto keeps symlinks and permissions, which an artifact upload of the folder would lose
        run: mkdir out-app && ditto -c -k --keepParent dist-bundle/nsviz.app "out-app/${{ matrix.bundle }}"
      - uses: actions/upload-artifact@v4
        if: matrix.bundle
        with:
          name: ${{ matrix.bundle }}
          path: out-app/${{ matrix.bundle }}
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" --draft \
            --title "nsviz ${GITHUB_REF_NAME#v}" \
            --notes "See CHANGELOG.md. The Windows build is not code-signed, see README (Getting started)."
